<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Misi Angkasa: 10 Soal</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle, #1a2a6c, #b21f1f, #fdbb2d); /* Galaxy background */
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .cockpit {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 4px solid #4ecdc4;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 0 20px #4ecdc4;
            position: relative;
        }

        /* HEADER */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            padding-bottom: 10px;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            margin: 0;
            color: #FFD700;
            text-shadow: 2px 2px #000;
        }

        .stats {
            font-size: 1.2em;
            font-weight: bold;
        }

        /* TIMER BAR */
        .timer-container {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .timer-fill {
            height: 100%;
            width: 100%;
            background: #ff6b6b;
            transition: width 1s linear;
        }

        /* SOAL */
        .question-box {
            font-size: 1.4em;
            margin-bottom: 25px;
            line-height: 1.4;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #FFD700;
        }

        /* OPSI JAWABAN */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: linear-gradient(145deg, #2c3e50, #34495e);
            color: white;
            border: 2px solid #4ecdc4;
            padding: 15px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Nunito', sans-serif;
            font-weight: bold;
        }

        .option-btn:hover {
            transform: translateY(-3px);
            background: #4ecdc4;
            color: black;
            box-shadow: 0 5px 15px rgba(78, 205, 196, 0.4);
        }

        .option-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* FEEDBACK COLORS */
        .correct { background: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; }
        .wrong { background: #e74c3c !important; color: white !important; border-color: #c0392b !important; }

        /* EXPLANATION BOX */
        .explanation {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            display: none; /* Hidden by default */
            animation: fadeIn 0.5s;
        }

        .next-btn {
            background: #FFD700;
            color: black;
            border: none;
            padding: 10px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
            display: none;
            float: right;
            font-family: 'Fredoka One', cursive;
        }

        /* RESULT SCREEN */
        .result-screen {
            display: none;
            text-align: center;
        }
        .rank-badge { font-size: 5em; margin: 20px 0; display: block; animation: pop 0.5s infinite alternate; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pop { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="cockpit" id="quiz-panel">
    <div class="hud-header">
        <div class="stats">SCORE: <span id="score" style="color:#2ecc71">0</span></div>
        <h1>🚀 MISI ANGKASA</h1>
        <div class="stats">SOAL: <span id="q-progress">1</span>/10</div>
    </div>

    <div class="timer-container">
        <div class="timer-fill" id="timer-bar"></div>
    </div>

    <div id="game-area">
        <div class="question-box" id="question-text">
            Memuat Data Misi...
        </div>

        <div class="options-grid" id="options-container">
            </div>

        <div class="explanation" id="explanation-box">
            <h3 id="feedback-title"></h3>
            <p id="feedback-text"></p>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">SOAL BERIKUTNYA ▶</button>
        </div>
    </div>
</div>

<div class="cockpit result-screen" id="result-panel">
    <h1>MISI SELESAI!</h1>
    <span class="rank-badge">🏆</span>
    <h2 id="final-rank">GRAND MASTER</h2>
    <p style="font-size: 1.5em;">Skor Akhir: <span id="final-score" style="color:#FFD700">0</span></p>
    <button class="next-btn" style="display:inline-block; float:none;" onclick="location.reload()">MAIN LAGI</button>
</div>

<script>
    // --- DATABASE SOAL (10 SOAL) ---
    const questions = [
        {
            q: "<b>[TRAPESIUM]</b><br>Sebuah sayap pesawat punya Sisi Atas 4m dan Sisi Bawah 6m. Tingginya 5m. Berapa Luasnya?",
            options: ["25 m²", "50 m²", "24 m²", "10 m²"],
            correct: 0,
            expl: "Rumus: (Atas + Bawah) × Tinggi ÷ 2.<br>(4 + 6) × 5 ÷ 2 = 10 × 5 ÷ 2 = <b>25</b>."
        },
        {
            q: "<b>[LAYANG-LAYANG]</b><br>Drone satelit punya Diagonal 1 = 10 cm dan Diagonal 2 = 8 cm. Hitung luasnya!",
            options: ["80 cm²", "40 cm²", "18 cm²", "100 cm²"],
            correct: 1,
            expl: "Rumus: (d1 × d2) ÷ 2.<br>(10 × 8) ÷ 2 = 80 ÷ 2 = <b>40</b>."
        },
        {
            q: "<b>[LINGKARAN]</b><br>Jika Diameter (d) sebuah planet adalah 100 km, berapa Jari-jarinya (r)?",
            options: ["200 km", "50 km", "10 km", "314 km"],
            correct: 1,
            expl: "Jari-jari adalah setengahnya Diameter.<br>100 ÷ 2 = <b>50</b>."
        },
        {
            q: "<b>[TRAPESIUM - KELILING]</b><br>Hitung Keliling pagar berbentuk Trapesium dengan sisi: 5m, 5m, 10m, 4m.",
            options: ["24 m", "100 m", "12 m", "20 m"],
            correct: 0,
            expl: "Keliling = Jumlahkan semua sisi luar.<br>5 + 5 + 10 + 4 = <b>24</b>."
        },
        {
            q: "<b>[LINGKARAN - KELILING]</b><br>Roda pesawat punya diameter 14 cm. Berapa Keliling rodanya? (π = 22/7)",
            options: ["22 cm", "154 cm", "44 cm", "88 cm"],
            correct: 2,
            expl: "Rumus: π × d.<br>22/7 × 14 = 22 × 2 = <b>44</b>."
        },
        {
            q: "<b>[HOTS - KONSEP]</b><br>Manakah bangun datar yang rumus Luasnya TIDAK menggunakan 'Dibagi 2'?",
            options: ["Segitiga", "Trapesium", "Lingkaran", "Layang-layang"],
            correct: 2,
            expl: "Segitiga, Trapesium, Layang-layang semua dibagi 2.<br>Luas Lingkaran = π × r × r (Tidak dibagi 2)."
        },
        {
            q: "<b>[LAYANG-LAYANG]</b><br>Luas layangan adalah 30 cm². Jika diagonal 1 adalah 6 cm, berapa diagonal 2-nya?",
            options: ["5 cm", "10 cm", "15 cm", "3 cm"],
            correct: 1,
            expl: "Cara Detektif (Balik Rumus):<br>Luas × 2 ÷ d1.<br>30 × 2 = 60. 60 ÷ 6 = <b>10</b>."
        },
        {
            q: "<b>[LINGKARAN - LUAS]</b><br>Piring UFO punya jari-jari 10 m. Hitung Luasnya! (Gunakan π = 3,14)",
            options: ["31,4 m²", "314 m²", "100 m²", "628 m²"],
            correct: 1,
            expl: "Rumus: π × r × r.<br>3,14 × 10 × 10 = 3,14 × 100 = <b>314</b>."
        },
        {
            q: "<b>[TRAPESIUM - JEBAKAN]</b><br>Hitung LUAS: Atas=10, Bawah=20, Tinggi=8, Sisi Miring=12.",
            options: ["120", "180", "150", "300"],
            correct: 0,
            expl: "Awas sisi miring! Pakai Tinggi (8).<br>(10+20) × 8 ÷ 2 = 30 × 8 ÷ 2 = 240 ÷ 2 = <b>120</b>."
        },
        {
            q: "<b>[LOGIKA]</b><br>Angka Pi (π) 22/7 paling cocok dipakai untuk angka jari-jari kelipatan berapa?",
            options: ["10", "5", "7", "100"],
            correct: 2,
            expl: "22/7 digunakan untuk angka kelipatan 7 (7, 14, 21, 28...)."
        }
    ];

    // --- VARIABEL GAME ---
    let currentQ = 0;
    let score = 0;
    let timeLeft = 30; // 30 detik per soal agar lebih cepat (atau bisa diubah 120)
    let timerInterval;

    // --- FUNGSI ---
    function initGame() {
        loadQuestion();
    }

    function loadQuestion() {
        // Reset UI
        document.getElementById('explanation-box').style.display = 'none';
        document.getElementById('q-progress').innerText = currentQ + 1;
        
        // Load Data
        const data = questions[currentQ];
        document.getElementById('question-text').innerHTML = data.q;
        
        const optContainer = document.getElementById('options-container');
        optContainer.innerHTML = '';
        
        data.options.forEach((opt, index) => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optContainer.appendChild(btn);
        });

        // Reset Timer
        resetTimer();
    }

    function resetTimer() {
        clearInterval(timerInterval);
        timeLeft = 120; // 2 Menit sesuai request
        document.getElementById('timer-bar').style.width = '100%';
        document.getElementById('timer-bar').style.backgroundColor = '#ff6b6b';
        
        timerInterval = setInterval(() => {
            timeLeft--;
            let percent = (timeLeft / 120) * 100;
            document.getElementById('timer-bar').style.width = percent + '%';

            if(timeLeft <= 0) timeOut();
        }, 1000);
    }

    function checkAnswer(selectedIndex, btnElement) {
        clearInterval(timerInterval);
        const data = questions[currentQ];
        const allBtns = document.querySelectorAll('.option-btn');
        
        // Disable buttons
        allBtns.forEach(b => b.disabled = true);

        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackText = document.getElementById('feedback-text');
        const explBox = document.getElementById('explanation-box');

        if(selectedIndex === data.correct) {
            // BENAR
            btnElement.classList.add('correct');
            score += 100;
            document.getElementById('score').innerText = score;
            feedbackTitle.innerText = "✅ TEPAT SEKALI, KAPTEN!";
            feedbackTitle.style.color = "#2ecc71";
        } else {
            // SALAH
            btnElement.classList.add('wrong');
            allBtns[data.correct].classList.add('correct'); // Show correct answer
            feedbackTitle.innerText = "❌ KOORDINAT MELESET!";
            feedbackTitle.style.color = "#ff6b6b";
        }

        feedbackText.innerHTML = data.expl;
        explBox.style.display = 'block';
        document.getElementById('next-btn').style.display = 'block';
    }

    function timeOut() {
        const data = questions[currentQ];
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);
        allBtns[data.correct].classList.add('correct');

        const explBox = document.getElementById('explanation-box');
        document.getElementById('feedback-title').innerText = "⏰ WAKTU HABIS!";
        document.getElementById('feedback-title').style.color = "#ff6b6b";
        document.getElementById('feedback-text').innerHTML = data.expl;
        explBox.style.display = 'block';
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQ++;
        if(currentQ < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-panel').style.display = 'none';
        document.getElementById('result-panel').style.display = 'block';
        document.getElementById('final-score').innerText = score;

        const rankText = document.getElementById('final-rank');
        const badge = document.querySelector('.rank-badge');

        if(score >= 900) {
            rankText.innerText = "GRAND MASTER PILOT";
            rankText.style.color = "#FFD700";
            badge.innerText = "👑";
        } else if (score >= 700) {
            rankText.innerText = "KAPTEN SENIOR";
            rankText.style.color = "#4ecdc4";
            badge.innerText = "👨‍✈️";
        } else {
            rankText.innerText = "KADET PEMULA";
            rankText.style.color = "#fff";
            badge.innerText = "👮";
        }
    }

    // Start
    initGame();

</script>

</body>
</html>
